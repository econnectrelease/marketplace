name: Validate Extensions Packaging & Security

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:
    inputs:
      audit_scope:
        description: "Scope of audit: 'all' (all extensions in repository) or 'changed' (only modified extensions)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - changed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-extensions:
    name: Unpack, Validate & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Security Scanners (Bandit)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install bandit

      - name: Run Extension Format Verification & Malware Audit
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_BEFORE: ${{ github.event.before }}
          AUDIT_SCOPE: ${{ inputs.audit_scope || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'all') || (github.event_name == 'pull_request' && 'changed') || 'all' }}
        run: |
          echo "=================================================="
          echo "🚀 Event: ${{ github.event_name }} | Branch/Ref: ${{ github.ref }}"
          echo "🎯 Audit Scope: $AUDIT_SCOPE"
          echo "=================================================="
          if [ "$AUDIT_SCOPE" = "all" ]; then
            python3 .github/scripts/validate_extensions.py --all
          else
            python3 .github/scripts/validate_extensions.py --changed-only
          fi
